name: Check Yegara release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run release
        env:
          NEXT_PUBLIC_SITE_URL: https://yihonaltrading.com
      - uses: actions/upload-artifact@v4
        with:
          name: yihonal-trading-yegara
          path: release/yihonal-trading-yegara.zip
